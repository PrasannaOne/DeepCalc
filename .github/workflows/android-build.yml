
name: Build DeepCalc Android

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare DeepCalc
        run: |
          set -e
          mkdir -p www

          for f in index.html styles.css app.js service-worker.js manifest.webmanifest apple-touch-icon.png favicon-32.png icon-192.png icon-512.png icon-maskable-512.png og-image.png; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done

          cat > package.json <<'EOF'
          {
            "name": "deepcalc-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^8.0.0",
              "@capacitor/core": "^8.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^8.0.0"
            }
          }
          EOF

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.prasannaone.deepcalc",
            "appName": "DeepCalc",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

          npm install
          npx cap add android
          npx cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/deepcalc-release.jks
          chmod 600 android/app/deepcalc-release.jks

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("android/app/build.gradle")
          s = p.read_text()

          signing = """
              signingConfigs {
                  release {
                      storeFile file("deepcalc-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }

          """

          if "signingConfigs {" not in s:
              if "buildTypes {" not in s:
                  raise SystemExit("Could not find buildTypes block")
              s = s.replace("    buildTypes {", signing + "    buildTypes {", 1)

          pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          if "signingConfig signingConfigs.release" not in s:
              s, count = re.subn(
                  pattern,
                  r"\1\n            signingConfig signingConfigs.release",
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not configure release signing")

          p.write_text(s)
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build signed release APK and AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease

      - name: Collect build outputs
        run: |
          set -e
          mkdir -p output

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            output/DeepCalc-debug.apk

          cp android/app/build/outputs/apk/release/app-release.apk \
            output/DeepCalc-release-universal.apk

          cp android/app/build/outputs/bundle/release/app-release.aab \
            output/DeepCalc-release.aab

          zip -qr output/DeepCalc-Android-Source.zip \
            android www package.json package-lock.json capacitor.config.json \
            LICENSE README.md index.html styles.css app.js service-worker.js \
            manifest.webmanifest \
            -x "android/.gradle/*" \
               "android/**/build/*" \
               "android/**/.cxx/*" \
               "android/local.properties" \
               "android/app/deepcalc-release.jks" \
               "android/.idea/*" \
               "android/.git/*"

      - name: Upload all builds
        uses: actions/upload-artifact@v7
        with:
          name: DeepCalc-Android-Complete
          path: output/*
          if-no-files-found: error
          retention-days: 30
          
