name: DeepCalc Native Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'DeepCalc-Android-Source.zip'
      - 'DeepCalc-Android/**'

permissions:
  contents: write

concurrency:
  group: deepcalc-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install native project folder from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ -f DeepCalc-Android-Source.zip ]; then
            unzip -t DeepCalc-Android-Source.zip
            python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          archive = "DeepCalc-Android-Source.zip"
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
          if not names:
              raise SystemExit("The source ZIP is empty.")
          for name in names:
              path = PurePosixPath(name)
              if path.is_absolute() or ".." in path.parts or "\\" in name:
                  raise SystemExit(f"Unsafe ZIP entry: {name}")
              if not path.parts or path.parts[0] != "DeepCalc-Android":
                  raise SystemExit(f"Unexpected ZIP root: {name}")
          PY
            rm -rf DeepCalc-Android
            unzip -q DeepCalc-Android-Source.zip -d .
            test -f DeepCalc-Android/settings.gradle.kts
            test -f DeepCalc-Android/build.gradle.kts
            test -f DeepCalc-Android/app/build.gradle.kts
            test -f DeepCalc-Android/app/src/main/java/com/prasannaone/deepcalc/MainActivity.kt
            test -f DeepCalc-Android/app/src/main/java/com/prasannaone/deepcalc/CalculatorEngine.kt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A DeepCalc-Android
            git rm -f DeepCalc-Android-Source.zip
            if ! git diff --cached --quiet; then
              git commit -m "Update isolated DeepCalc native Android project"
              git push
            fi
          else
            test -f DeepCalc-Android/settings.gradle.kts
            test -f DeepCalc-Android/build.gradle.kts
            test -f DeepCalc-Android/app/build.gradle.kts
          fi

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android 17 SDK and Build Tools
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.0'

      - name: Decode release signing key (when configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deepcalc-release.jks"
            echo "DEEPCALC_KEYSTORE_FILE=$RUNNER_TEMP/deepcalc-release.jks" >> "$GITHUB_ENV"
            echo "DEEPCALC_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "DEEPCALC_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "DEEPCALC_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests and build APK/AAB
        working-directory: DeepCalc-Android
        run: |
          gradle --no-daemon --stacktrace --warning-mode=all \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:bundleRelease

      - name: Collect build outputs
        run: |
          set -euo pipefail
          mkdir -p output
          cp DeepCalc-Android/app/build/outputs/apk/debug/*.apk output/DeepCalc-Native-debug.apk
          cp DeepCalc-Android/app/build/outputs/apk/release/*.apk output/DeepCalc-Native-release.apk
          cp DeepCalc-Android/app/build/outputs/bundle/release/*.aab output/DeepCalc-Native-release.aab
          cp -r DeepCalc-Android/app/build/reports/tests/testDebugUnitTest output/test-reports
          {
            echo "## DeepCalc native Android build"
            echo ""
            echo "- Gradle: 9.7.0"
            echo "- Android Gradle Plugin: 9.3.0"
            echo "- Kotlin: 2.4.21"
            echo "- Compile/target SDK: 37 (Android 17)"
            echo "- Unit tests: passed"
            echo "- Outputs: debug APK, release APK, release AAB"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit-test reports (including failures)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DeepCalc-Unit-Test-Reports
          path: DeepCalc-Android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload APK, AAB and test reports
        uses: actions/upload-artifact@v7
        with:
          name: DeepCalc-Native-Android
          path: output/**
          retention-days: 30
